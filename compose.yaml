# Dokploy deployment. Traefik (Dokploy's proxy) only routes requests that carry
# "Authorization: Bearer $MCP_TOKEN", strips that header, and forwards to the
# container. The server additionally requires the secret path /mcp/$MCP_SECRET.
# Set MCP_TOKEN, MCP_SECRET, NEMLIG_USER, NEMLIG_PASS and MCP_DOMAIN in
# Dokploy's Environment tab. Do not add a domain in Dokploy's Domains tab for
# this service: that would create a second route without the header check.
services:
  nemligmcp:
    build: .
    restart: unless-stopped
    init: true
    environment:
      MCP_SECRET: ${MCP_SECRET:?set MCP_SECRET}
      NEMLIG_USER: ${NEMLIG_USER:?set NEMLIG_USER}
      NEMLIG_PASS: ${NEMLIG_PASS:?set NEMLIG_PASS}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.nemligmcp.rule=Host(`${MCP_DOMAIN:?set MCP_DOMAIN}`) && Header(`Authorization`, `Bearer ${MCP_TOKEN:?set MCP_TOKEN}`)
      - traefik.http.routers.nemligmcp.entrypoints=websecure
      - traefik.http.routers.nemligmcp.tls.certresolver=letsencrypt
      - traefik.http.routers.nemligmcp.middlewares=nemligmcp-strip-auth
      - traefik.http.middlewares.nemligmcp-strip-auth.headers.customrequestheaders.Authorization=
      - traefik.http.services.nemligmcp.loadbalancer.server.port=3000
networks:
  dokploy-network:
    external: true
